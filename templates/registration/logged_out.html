<!-- Página de confirmación tras cerrar sesión -->
{% extends "gamerank/base.html" %}
{% load i18n %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card shadow p-4 text-center" style="max-width: 500px; width: 100%;">

        <!-- Mensaje principal -->
        <h2 class="mb-3">{% trans "Has cerrado sesión correctamente" %}</h2>
        <p>{% trans "Gracias por usar" %} <strong>GameRank</strong>.</p>

        <!-- Botones de navegación -->
        <a href="{% url 'login' %}" class="btn btn-outline-primary mt-3">
            {% trans "Iniciar sesión de nuevo" %}
        </a>
        <a href="{% url 'inicio' %}" class="btn btn-link mt-2">
            ← {% trans "Volver a la página principal" %}
        </a>
    </div>
</div>
{% endblock %}
