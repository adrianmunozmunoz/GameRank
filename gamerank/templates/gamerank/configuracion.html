{% extends "gamerank/base.html" %}  <!-- Hereda de la plantilla base común -->

{% block content %}
<!-- CONTENEDOR PRINCIPAL CENTRADO -->
<div class="container mt-5 d-flex justify-content-center">

    <!-- TARJETA CON SOMBRA Y PADDING -->
    <div class="card shadow-sm p-4" style="max-width: 500px; width: 100%;">

        <!-- TÍTULO DE LA SECCIÓN -->
        <h4 class="mb-3">🎛️ Configura tu experiencia</h4>

        <!-- FORMULARIO PARA ENVIAR CONFIGURACIÓN -->
        <form method="POST">
            {% csrf_token %}

            <!-- CAMPO: ALIAS -->
            <div class="mb-3">
                <label for="alias" class="form-label">Alias</label>
                <!-- El valor por defecto es el alias actual del usuario -->
                <input type="text" id="alias" name="alias" class="form-control" value="{{ config.alias }}">
                <small class="text-muted">Este nombre aparecerá en la cabecera.</small>
            </div>

            <!-- CAMPO: TIPO DE LETRA -->
            <div class="mb-3">
                <label for="tipo_letra" class="form-label">Tipo de letra</label>
                <!-- Se selecciona dinámicamente la opción actual del usuario -->
                <select id="tipo_letra" name="tipo_letra" class="form-select">
                    <option value="fuente-sans-serif" {% if config.tipo_letra == "fuente-sans-serif" %}selected{% endif %}>Sans Serif</option>
                    <option value="fuente-serif" {% if config.tipo_letra == "fuente-serif" %}selected{% endif %}>Serif</option>
                    <option value="fuente-monospace" {% if config.tipo_letra == "fuente-monospace" %}selected{% endif %}>Monoespaciada</option>
                    <option value="fuente-decorativa" {% if config.tipo_letra == "fuente-decorativa" %}selected{% endif %}>Decorativa</option>

                </select>
            </div>

            <!-- CAMPO: TAMAÑO DEL TEXTO -->
            <div class="mb-3">
                <label for="tamano_texto" class="form-label">Tamaño del texto</label>
                <select id="tamano_texto" name="tamano_texto" class="form-select">
                    <option value="tamano-small" {% if config.tamano_texto == "tamano-small" %}selected{% endif %}>Pequeño</option>
                    <option value="tamano-medium" {% if config.tamano_texto == "tamano-medium" %}selected{% endif %}>Mediano</option>
                    <option value="tamano-large" {% if config.tamano_texto == "tamano-large" %}selected{% endif %}>Grande</option>
                    <option value="tamano-xl" {% if config.tamano_texto == "tamano-xl" %}selected{% endif %}>Extra grande</option>
                </select>
            </div>

            <!-- BOTÓN DE ENVÍO -->
            <div class="d-grid">
                <button type="submit" class="btn btn-success">Guardar cambios</button>
            </div>
        </form>

        <!-- BOTÓN PARA VOLVER AL PERFIL -->
        <div class="text-center mt-3">
            <a href="{% url 'pagina_usuario' %}" class="btn btn-link">← Volver a tu perfil</a>
        </div>
    </div>
</div>
{% endblock %}
