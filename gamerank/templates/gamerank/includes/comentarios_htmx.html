{% load i18n %}

<!-- Lista de comentarios renderizados como tarjetas -->
<ul class="list-group list-group-flush">
    {% for comentario in comentarios %}
        <!-- Cada comentario es un <li> con estilo de tarjeta, definido en el include -->
        {% include "gamerank/includes/comentario_individual.html" %}
    {% empty %}
        <!-- Mensaje cuando no hay comentarios -->
        <li class="list-group-item text-muted text-center">{% trans "Todavía no hay comentarios." %}</li>
    {% endfor %}
</ul>
